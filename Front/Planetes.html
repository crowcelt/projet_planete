<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visualisation des trajectoires – Projet CIR1</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <!-- PANNEAU INFO PLANÈTE (DROITE) -->
    <div id="planetInfoPanel">
        <span id="closePopup">&times;</span>
        <img id="popupImage" style="width:150px; border-radius:8px; margin:10px auto; display:block;">
        <h2 id="popupTitle"></h2>
        <p id="popupDetails"></p>
        <a id="popupMore" href="#" target="_blank" class="moreLink">
            Pour en savoir plus
        </a>
    </div>

    <!-- TITRE + IMPORT JSON -->
    <h1>Visualisation des trajectoires (Projet CIR1)</h1>

    <!-- PANNEAU DE CONTRÔLE FIXE -->
    <div id="controlsBox">
            <p>Chargez votre fichier JSON généré par le programme C :</p>
            <input type="file" id="fileInput" accept=".json">

        <h3>Affichage des trajectoires</h3>

        <!-- ACCORDÉONS PLANÈTES -->
        <div id="accordionContainer"></div>

        <div id="dayCounter" style="color:white; margin-bottom:8px;">
        Jours écoulés : 0
        </div>


        <!-- SLIDER VITESSE -->
    <div class="slider-container">
        <label for="speedSlider">Vitesse simu</label>
        <input type="range" id="speedSlider" min="50" max="10000" step="100" value="50">
    </div>


        <!-- SLIDER ZOOM -->
        <div class="slider-container">
            <label for="zoomSlider">Zoom</label>
            <input type="range" id="zoomSlider" min="0.05" max="2" step="0.01" value="1">
        </div>

    </div>

    <!-- CONTENEUR DU CANVAS P5.JS -->
    <div id="canvasContainer"></div>

    <!-- CRÉDITS -->
    <div id="credits">
        <footer>
            Projet CIR1 | Visualisation des trajectoires • Réalisé par Le Gall Corre Mickaël et Raphaël Corre © 2026
        </footer>
    </div>

    <!-- LIBRAIRIE P5.JS -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

    <!-- TON SCRIPT -->
    <script src="Traj_planetes.js"></script>

</body>
</html>
